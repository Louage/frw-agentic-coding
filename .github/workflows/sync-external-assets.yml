name: Sync External AI Assets

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write # required to dispatch the Release workflow after the merge

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync external sources
        shell: pwsh
        run: |
          ./automation/scripts/Sync-ExternalSources.ps1 -Clean

      - name: Normalize agent tools
        shell: pwsh
        run: |
          ./automation/scripts/Normalize-AgentTools.ps1

      - name: Reapply AC/DC agent personas
        run: npm run rename:personas

      - name: Regenerate agent greetings
        run: npm run regenerate:agents

      - name: Validate agent personas and greetings reapplied
        shell: pwsh
        run: |
          ./automation/scripts/Validate-AgentPersonas.ps1

      - name: Validate agent handoff integrity
        shell: pwsh
        run: |
          ./automation/scripts/Validate-AgentHandoffs.ps1

      - name: Validate source contracts
        run: npm run validate:source-contract:strict

      - name: Sync MCP knowledge sources
        shell: pwsh
        run: |
          ./automation/scripts/Sync-McpKnowledgeSources.ps1 -Clean

      - name: Generate contribution manifest
        shell: pwsh
        run: |
          ./automation/scripts/Generate-ContributionManifest.ps1

      - name: Apply generated contributions to package.json
        shell: pwsh
        run: |
          ./automation/scripts/Apply-ContributionManifest.ps1

      - name: Validate generated contribution paths
        run: npm run validate:contribution-paths

      - name: Validate MCP source schemas
        run: npm run validate:mcp-schemas

      - name: Validate no absolute local paths
        shell: pwsh
        run: |
          $filesToCheck = @(
            "automation/mcp/sources.lock.json",
            "assets/generated/provenance.json",
            "assets/generated/contributions.generated.json"
          )

          $absolutePathPattern = '(?i)([a-z]:\\[^\s"'']+|/Users/[^\s"'']+|/home/[^\s"'']+)'
          $violations = @()

          foreach ($file in $filesToCheck) {
            if (-not (Test-Path -LiteralPath $file)) {
              continue
            }

            $content = Get-Content -LiteralPath $file -Raw -Encoding UTF8
            if ($content -match $absolutePathPattern) {
              $violations += $file
            }
          }

          if ($violations.Count -gt 0) {
            throw "Detected absolute local path(s) in generated artifacts: $($violations -join ', ')"
          }

      - name: Validate extension build
        run: npm run compile

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        env:
          HUSKY: 0
        with:
          commit-message: "chore(assets): sync external AI assets"
          title: "chore(assets): sync external AI assets"
          body: |
            Automated sync of external AI assets.

            Changes include:
            - refreshed source clones
            - regenerated merged assets under assets/generated
            - refreshed MCP knowledge source lock under automation/mcp
            - updated generated contribution manifest
            - synchronized package contributions

            This PR is auto-merged and cuts a patch release: the refreshed
            assets ship inside the VSIX, so they must reach the Marketplace.
          branch: chore/sync-external-ai-assets
          branch-suffix: timestamp
          delete-branch: true
          force-push: true
          labels: |
            automation
            assets

      # No PR means the sync produced no diff — nothing to merge, and the
      # release stays skipped.
      - name: Auto-merge sync PR
        id: merge
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          set -euo pipefail
          if gh pr merge "$PR" --squash --delete-branch; then
            echo "merged=true" >> "$GITHUB_OUTPUT"
          else
            # Branch protection may require checks that have not reported yet;
            # queue the merge instead of failing the sync.
            echo "merged=false" >> "$GITHUB_OUTPUT"
            gh pr merge "$PR" --squash --delete-branch --auto
            echo "::warning::Immediate merge refused — auto-merge queued on PR #$PR. Release must be dispatched manually once it lands."
          fi

      # A merge pushed with GITHUB_TOKEN does not raise a `push` event, so the
      # Release workflow would never see the asset commit. workflow_dispatch is
      # the documented exception to that rule.
      - name: Trigger release
        if: steps.merge.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run release.yml --ref main
